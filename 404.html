<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 | Maxime Haegeman</title>
    <link rel="icon" type="image/svg+xml" href="content/icon.svg">
    <script src="theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .nf-wrap {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
        }
        .nf-code {
            font-family: var(--font-display);
            font-size: clamp(5rem, 18vw, 12rem);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -4px;
            color: var(--text-primary);
        }
        .nf-code .accent { color: var(--accent-color); }
        .nf-terminal {
            font-family: var(--font-code);
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 20px;
            line-height: 2;
        }
        .nf-terminal .prompt { color: var(--accent-color); }
        .nf-home {
            display: inline-block;
            margin-top: 28px;
            font-family: var(--font-code);
            font-size: 0.9rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 12px 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nf-home:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nf-wrap">
            <span class="section-label">Error // Page Not Found</span>
            <h1 class="nf-code">4<span class="accent">0</span>4</h1>
            <div class="nf-terminal">
                <div><span class="prompt">$</span> cd requested_page/</div>
                <div>bash: cd: requested_page/: No such file or directory</div>
                <div><span class="prompt">$</span> suggestions --available</div>
                <div>&gt; try the navigation, or head home:</div>
            </div>
            <a href="index.html" class="nf-home">cd ~/ &nbsp;→</a>
        </div>
    </div>
</body>

</html>
